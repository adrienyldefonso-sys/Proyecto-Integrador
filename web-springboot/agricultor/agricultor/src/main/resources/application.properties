spring.application.name=agricultor
server.port=8080
# Solo esta laptop. Para que el celular físico llegue, se cambia a 0.0.0.0
server.address=127.0.0.1

# Mismos nombres de variables que el .env de Django. Los valores por defecto son los de XAMPP (solo desarrollo).
spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ojodchakra}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Las tablas las crean las migraciones de Django: Hibernate nunca debe crearlas ni cambiarlas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Clave provisional de la app móvil. Se reemplazará por el inicio de sesión del agricultor.
app.api-key=${API_KEY:dev-demo-key}